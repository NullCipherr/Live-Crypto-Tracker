<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('lct-preferences-v1');
          var prefs = raw ? JSON.parse(raw) : null;
          var mode = prefs && prefs.themeMode ? prefs.themeMode : 'dark';
          var theme =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode === 'light'
                ? 'light'
                : 'dark';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <title>Live Crypto Tracker</title>
    <style>
      #lct-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0b0f17;
        color: #94a3b8;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        opacity: 1;
        transition: opacity 220ms cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: none;
      }
      html.light #lct-boot-loader {
        background: #f8fafc;
        color: #64748b;
      }
      #lct-boot-loader.is-hidden {
        opacity: 0;
      }
      .lct-boot-spinner {
        width: 28px;
        height: 28px;
        border-radius: 9999px;
        border: 2px solid rgba(130, 180, 255, 0.18);
        border-top-color: #82b4ff;
        animation: lct-boot-spin 0.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      .lct-boot-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0.85;
      }
      @keyframes lct-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="lct-boot-loader" aria-hidden="true">
      <div class="lct-boot-spinner"></div>
      <span class="lct-boot-label">LCT</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
